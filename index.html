<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 35%,#22c55e 0%,#15803d 45%,#064e2b 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .45s ease,visibility .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:spPop .6s cubic-bezier(.34,1.56,.64,1) both,spPulse 1.8s ease-in-out .6s infinite}
#splash h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.3px;animation:spFade .6s .25s both}
#splash .bar{width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:#fff;animation:spLoad 1.1s ease-in-out infinite}
@keyframes spPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spPulse{50%{transform:scale(1.05)}}
@keyframes spFade{from{opacity:0;transform:translateY(8px)}}
@keyframes spLoad{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}

  <div class="app-shell">
    <nav class="studio-tabs" id="studioTabs"><button class="active" data-tab="video">Video Key</button><button data-tab="sticker">Sticker Maker</button><button data-tab="removebg">Remove BG</button><button data-tab="library">Library</button></nav>
    <header class="topbar">
      <div class="brand-wrap">
        <img class="logo logo-img" alt="" src="${((Sn=document.getElementById("brandLogo"))==null?void 0:Sn.src)||""}" />
        <div class="brand"><h1>Creative Studio</h1><p>Green screen → transparent sticker</p></div>
      </div>
      <div class="privacy-badge">● On-device</div>
    </header>

    <section class="stage-card">
      <div class="stage-head">
        <div class="segmented" id="viewMode">
          <button class="active" data-mode="after">After</button>
          <button data-mode="before">Before</button>
        </div>
        <div class="segmented" id="bgMode">
          <button class="active" data-bg="checker">Checker</button>
          <button data-bg="black">Black</button>
          <button data-bg="white">White</button>
          <button data-bg="red">Red</button>
          <button data-bg="blue">Blue</button>
        </div>
      </div>
      <div class="preview-zone" id="previewZone">
        <button class="expand-close" id="expandClose" aria-label="Close full screen" title="Close">✕</button>
        <div class="preview-wrap bg-checker" id="previewWrap">
          <canvas id="previewCanvas" width="640" height="360"></canvas>
          <div class="drop-state" id="dropState">
            <div>
              <div class="drop-icon">✦</div>
              <h2>Drop in a green-screen video</h2>
              <p>MP4, MOV, or WebM. Best results come from an evenly lit solid green background and clear gaps around hands/arms.</p>
              <button class="primary-btn" id="chooseBtn">Choose video</button>
                <div class="load-status" id="loadStatus"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="stage-foot">
      <div class="transport">
        <div class="transport-side">
          <button class="ghost-icon" id="fullscreenBtn" title="Full screen preview" aria-label="Full screen preview"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
        <button class="icon-btn play-btn" id="playBtn" disabled aria-label="Play / pause">▶</button>
        <div class="transport-side right">
          <button class="ghost-icon" id="quickCheckBtn" title="Check edges" aria-label="Check edges" disabled><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></button>
          <button class="ghost-icon" id="eyeDropBtn" title="Eyedropper: click the green in the preview" aria-label="Eyedropper" disabled><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 4 6 6-9 9H5v-6z"/><path d="m12 6 6 6"/></svg></button>
        </div>
      </div>
      <div class="time-row">
        <div class="time" id="timeLabel">00:00 / 00:00</div>
        <div class="file-name" id="fileName">No video loaded</div>
      </div>
      <div class="debug-line" id="debugLine" hidden>stage: idle · key – · transparent –</div>
      <div class="timeline" id="timeline">
        <div class="thumbs" id="thumbs"></div>
        <div class="trim-shade left" id="shadeL"></div>
        <div class="trim-shade right" id="shadeR"></div>
        <div class="trim-window" id="trimWindow">
          <div class="trim-handle start" id="handleStart" role="slider" aria-label="Trim start" tabindex="0"><i></i></div>
          <div class="trim-handle end" id="handleEnd" role="slider" aria-label="Trim end" tabindex="0"><i></i></div>
        </div>
        <div class="playhead" id="playhead"></div>
      </div>
      <div class="trim-row">
        <div><div class="control-head"><span>Trim start</span><output id="trimStartOut">0.00s</output></div>
          <input type="range" id="trimStart" min="0" max="1" step="0.01" value="0" disabled /></div>
        <div><div class="control-head"><span>Trim end</span><output id="trimEndOut">0.00s</output></div>
          <input type="range" id="trimEnd" min="0" max="1" step="0.01" value="1" disabled /></div>
      </div>
    </section>

    <section class="dock">
      <div class="dock-hint">Tap a tool below to adjust your sticker</div>
      <div class="controls-card sheet" id="controlsPanel" aria-hidden="true">
        <div class="sheet-grip"></div>
        <section class="section" data-tool="source">
          <div class="section-title"><h3>Source</h3><span>local only</span></div>
          <input id="fileInput" type="file" accept="video/*" hidden />
          <button class="secondary-btn" id="uploadBtn" style="width:100%">Upload video</button>
          <p class="small-note">Nothing is uploaded for processing. Your browser handles the frames locally.</p>
        </section>
        <section class="section" data-tool="key">
          <div class="section-title"><h3>Key color</h3><span>chroma key</span></div>
          <button class="clean-preset" id="cleanPreset">✨ Apply Clean Edge preset</button>
          <div class="control" style="margin-top:12px">
            <div class="control-head"><span>Key color</span><span id="keyHex">#46AA46</span></div>
            <div class="key-row">
              <input type="color" id="keyColor" value="#46aa46" />
              <button class="secondary-btn" id="sampleGreenBtn">Auto-detect from edges</button>
            </div>
          </div>
          <div class="key-status" id="keyStatus">
            <span class="key-dot" id="keyDot"></span>
            <div><b id="keySourceLabel">Generic green (no video yet)</b><small>Transparent in current frame: <span id="liveTransparent">–</span></small></div>
          </div>
          <p class="small-note">The key is auto-detected from the whole frame when a video loads (black bars and the subject are ignored). To pick it by hand, use the eyedropper icon above the timeline and click the green in the preview.</p>
        </section>
        <section class="section" data-tool="edges">
          <div class="section-title"><h3>Edges</h3><span>edge cleanup</span></div>
          <div class="control"><div class="control-head"><span>Tolerance</span><output id="tolOut">50</output></div>
            <input type="range" id="tolerance" min="5" max="95" value="50" /></div>
          <div class="control"><div class="control-head"><span>Key softness</span><output id="softOut">30</output></div>
            <input type="range" id="softness" min="1" max="80" value="30" /></div>
          <div class="control"><div class="control-head"><span>Matte contract / choke</span><output id="chokeOut">1px</output></div>
            <input type="range" id="choke" min="0" max="5" value="1" /></div>
          <div class="control"><div class="control-head"><span>Edge feather</span><output id="featherOut">0px</output></div>
            <input type="range" id="feather" min="0" max="3" value="0" /></div>
        </section>
        <section class="section" data-tool="spill">
          <div class="section-title"><h3>Spill</h3><span>halo control</span></div>
          <div class="control"><div class="control-head"><span>Green spill suppression</span><output id="spillOut">100%</output></div>
            <input type="range" id="spill" min="0" max="100" value="100" /></div>
          <div class="control"><div class="control-head"><span>GIF alpha threshold</span><output id="alphaOut">128</output></div>
            <input type="range" id="alphaThreshold" min="1" max="254" value="128" /></div>
        </section>
        <section class="section" data-tool="background">

          <div class="control">
            <div class="control-head"><span>Preview background</span></div>

              <button class="swatch sw-checker active" data-bg="checker" title="Checker">Checker</button>

              <button class="swatch sw-blue" data-bg="blue" title="Blue">Blue</button>

              <div class="bg-thumb" id="bgThumb"><span>No image</span></div>
              <div class="bg-image-actions">
                <button class="secondary-btn" id="bgUploadBtn">Upload image</button>
                <button class="secondary-btn danger" id="bgRemoveBtn" disabled>Remove</button>
              </div>
            </div>
          </div>
          <div class="control">
            <div class="control-head"><span>Fit</span></div>
            <div class="segmented fit-seg" id="bgFit">
              <button class="active" data-fit="cover">Cover</button>
              <button data-fit="contain">Contain</button>
              <button data-fit="stretch">Stretch</button>
            </div>
          </div>
