<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 35%,#22c55e 0%,#15803d 45%,#064e2b 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .45s ease,visibility .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:spPop .6s cubic-bezier(.34,1.56,.64,1) both,spPulse 1.8s ease-in-out .6s infinite}
#splash h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.3px;animation:spFade .6s .25s both}
#splash .bar{width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:#fff;animation:spLoad 1.1s ease-in-out infinite}
@keyframes spPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spPulse{50%{transform:scale(1.05)}}
@keyframes spFade{from{opacity:0;transform:translateY(8px)}}
@keyframes spLoad{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
