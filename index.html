        <section class="section" data-tool="edges">
          <div class="section-title"><h3>Edges</h3><span>edge cleanup</span></div>
          <div class="control"><div class="control-head"><span>Tolerance</span><output id="tolOut">50</output></div>
            <input type="range" id="tolerance" min="5" max="95" value="50" /></div>
          <div class="control"><div class="control-head"><span>Key softness</span><output id="softOut">30</output></div>
            <input type="range" id="softness" min="1" max="80" value="30" /></div>
          <div class="control"><div class="control-head"><span>Matte contract / choke</span><output id="chokeOut">1px</output></div>
            <input type="range" id="choke" min="0" max="5" value="1" /></div>
          <div class="control"><div class="control-head"><span>Edge feather</span><output id="featherOut">0px</output></div>
            <input type="range" id="feather" min="0" max="3" value="0" /></div>
        </section>
        <section class="section" data-tool="spill">
          <div class="section-title"><h3>Spill</h3><span>halo control</span></div>
          <div class="control"><div class="control-head"><span>Green spill suppression</span><output id="spillOut">100%</output></div>
            <input type="range" id="spill" min="0" max="100" value="100" /></div>
          <div class="control"><div class="control-head"><span>GIF alpha threshold</span><output id="alphaOut">128</output></div>
            <input type="range" id="alphaThreshold" min="1" max="254" value="128" /></div>
        </section>
        <section class="section" data-tool="background">
          <div class="section-title"><h3>Background</h3><span>preview &amp; optional export</span></div>
          <div class="control">
            <div class="control-head"><span>Preview background</span></div>
            <div class="bg-swatches" id="bgSwatches">
              <button class="swatch sw-checker active" data-bg="checker" title="Checker">Checker</button>
              <button class="swatch sw-black" data-bg="black" title="Black">Black</button>
              <button class="swatch sw-white" data-bg="white" title="White">White</button>
              <button class="swatch sw-red" data-bg="red" title="Red">Red</button>
              <button class="swatch sw-blue" data-bg="blue" title="Blue">Blue</button>
              <button class="swatch sw-image" data-bg="image" id="bgImageSwatch" title="Your image" disabled>Image</button>
            </div>
          </div>
          <div class="control">
            <div class="control-head"><span>Your image</span><span id="bgImageName">none</span></div>
            <input id="bgFileInput" type="file" accept="image/*" hidden />
            <div class="bg-image-row">
              <div class="bg-thumb" id="bgThumb"><span>No image</span></div>
              <div class="bg-image-actions">
                <button class="secondary-btn" id="bgUploadBtn">Upload image</button>
                <button class="secondary-btn danger" id="bgRemoveBtn" disabled>Remove</button>
              </div>
            </div>
          </div>
          <div class="control">
            <div class="control-head"><span>Fit</span></div>
            <div class="segmented fit-seg" id="bgFit">
              <button class="active" data-fit="cover">Cover</button>
              <button data-fit="contain">Contain</button>
              <button data-fit="stretch">Stretch</button>
            </div>
          </div>
          <p class="small-note">The image is only a backdrop. Exports stay <b>transparent</b> unless you choose “With background image” in Export.</p>
        </section>
        <section class="section" data-tool="check">
          <div class="section-title"><h3>Preview &amp; check</h3><span>inspect edges</span></div>
          <div class="presets">
            <button class="secondary-btn zoom-btn" data-zoom="1">1×</button>
            <button class="secondary-btn zoom-btn" data-zoom="2">2×</button>
            <button class="secondary-btn zoom-btn" data-zoom="4">4×</button>
            <button class="secondary-btn" id="giphyCheck">Check edges</button>
          </div>
          <div class="status" id="qualityStatus">Load a clip, then use <b>Check edges</b> over black and white backgrounds to spot halos.</div>
        </section>
        <section class="section" data-tool="size">
          <div class="section-title"><h3>Size</h3><span>output</span></div>
          <div class="control">
            <div class="control-head"><span>Size</span></div>
            <select id="sizePreset">

              <option value="1280x720" selected>HD landscape — 1280×720</option>
              <option value="1920x1080">Full HD landscape — 1920×1080</option>
              <option value="960x540">GIPHY optimized landscape — 960×540</option>
              </optgroup>
              <optgroup label="Vertical 9:16">
              <option value="540x960">GIPHY optimized — 540×960</option>
              <option value="1080x1920">HD vertical — 1080×1920</option>
              </optgroup>
              <optgroup label="Other">
              <option value="1080x1080">Square — 1080×1080</option>
              <option value="source">Source dimensions</option>
              </optgroup>
            </select>
          </div>
          <div class="control">
            <div class="control-head"><span>Frames per second</span></div>
            <select id="fps">
              <option>10</option><option selected>12</option><option>15</option><option>20</option><option>24</option>
            </select>
          </div>

        </section>
        <section class="section" data-tool="export">
          <div class="section-title"><h3>Export</h3><span>loop forever</span></div>
          <div class="control">
            <div class="control-head"><span>Export background</span></div>
            <div class="export-mode" id="exportMode" role="radiogroup">

            </div>
          </div>

            <button class="primary-btn" id="exportGif" disabled>Export transparent GIF</button>
            <button class="secondary-btn" id="exportPngZip" disabled>Export transparent PNG frames (.zip)</button>
          </div>
          <div class="progress-wrap" id="progressWrap">

            <div class="progress-label" id="progressLabel">Preparing…</div>
          </div>
          <div class="export-result" id="exportResult" hidden>
            <div class="result-preview bg-checker"><img id="resultImg" alt="Exported result" /></div>

              <div class="result-actions">

              </div>
              <small class="ios-tip">iPhone: choose <b>Save to Files</b> to keep transparency. Photos and Messages may flatten or convert GIFs.</small>
            </div>
          </div>
        </section>
      </div>
