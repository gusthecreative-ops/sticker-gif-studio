<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 35%,#22c55e 0%,#15803d 45%,#064e2b 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .45s ease,visibility .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:spPop .6s cubic-bezier(.34,1.56,.64,1) both,spPulse 1.8s ease-in-out .6s infinite}
#splash h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.3px;animation:spFade .6s .25s both}
#splash .bar{width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:#fff;animation:spLoad 1.1s ease-in-out infinite}
@keyframes spPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spPulse{50%{transform:scale(1.05)}}
@keyframes spFade{from{opacity:0;transform:translateY(8px)}}
@keyframes spLoad{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}

  <section class="sticker-view ar-view" id="arView" hidden>
    <div class="sk-stage">
      <div class="ar-preview" id="arWrap">
        <canvas id="arCanvas" width="540" height="720"></canvas>
        <div class="sk-empty" id="arEmpty"><div class="drop-icon">📸</div><h2>AR Camera</h2>
          <p>Face-tracked masks and accessories, made live on your device. Nothing leaves your phone.</p>
          <button class="primary-btn" id="arStart">Start camera</button><p class="small-note" id="arMsg"></p></div>
        <div class="sk-busy" id="arBusy" hidden><div class="progress-track"><div class="progress-bar" id="arBusyBar"></div></div><span id="arBusyLabel">Loading…</span></div>
        <div class="ar-hud"><button class="ar-round" id="arFlip" title="Flip camera" disabled>⟲</button><span class="ar-fps" id="arFps"></span><button class="ar-rec" id="arRec" disabled><i></i></button></div>
      </div>
    </div>
    <div class="sk-controls">
      <section class="section"><div class="section-title"><h3>Mask</h3><span id="arFace">no face</span></div>
        <div class="sk-chips" id="arMasks">${ii.map(([t,e],a)=>`<button data-m="${t}" class="${a===1?"active":""}">${e}</button>`).join("")}</div>
        <input type="file" id="arCustomFile" accept="image/*" hidden />
        <p class="small-note">Your image: use a cut-out PNG (e.g. from Remove BG) for best results. It follows your head; mouth and blinks animate the built-in characters.</p></section>
      <section class="section"><div class="section-title"><h3>Accessories</h3><span></span></div>
        <div class="sk-chips" id="arAcc"><button data-a="hat">🎩 Detective hat</button><button data-a="glasses">🕶 Sunglasses</button><button data-a="mustache">〰 Mustache</button></div></section>
      <section class="section"><div class="section-title"><h3>Background</h3><span id="arSegState"></span></div>
        <div class="segmented fit-seg" id="arBg"><button class="active" data-bg="off">Real</button><button data-bg="transparent">Transparent</button><button data-bg="green">Green</button><button data-bg="image">Image</button></div>
        <input type="file" id="arBgFile" accept="image/*" hidden /></section>
      <section class="section"><div class="section-title"><h3>Record GIF</h3><span id="arRecInfo"></span></div>
        <div class="sk-grid3">
          <label>Length<select id="arLen"><option value="2">2 s</option><option value="3" selected>3 s</option><option value="4">4 s</option><option value="5">5 s</option><option value="6">6 s</option></select></label>
          <label>Size<select id="arSize"><option value="240">240 w</option><option value="360" selected>360 w</option><option value="480">480 w</option></select></label>
          <label>FPS<select id="arFpsSel"><option>10</option><option selected>12</option><option>15</option></select></label>
        </div>
        <label class="check-row"><input type="checkbox" id="arDither" /> Dither (opaque areas only)</label>
